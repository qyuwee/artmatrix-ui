<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Art 8x8</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #181818;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 15px;
        }
        h2 { margin-bottom: 6px; }
        #status {
            font-size: 13px;
            margin-bottom: 10px;
            min-height: 18px;
            color: #aaa;
        }
        #status.ok { color: #4cd964; }
        #status.err { color: #ff6b6b; }
        #grid {
            display: grid;
            grid-template-columns: repeat(8, 35px);
            grid-template-rows: repeat(8, 35px);
            gap: 2px;
            background: #333;
            padding: 4px;
            border-radius: 8px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .cell {
            width: 35px;
            height: 35px;
            background: #000;
            border-radius: 4px;
            cursor: pointer;
            box-sizing: border-box;
            border: 1px solid #222;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
        button {
            background: #2ea6ff;
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background: #555; cursor: not-allowed; }
        button.danger { background: #ff4b4b; }
        .target-selector {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <h2>Pixel Art 8x8</h2>
    <div id="status">Подключение к брокеру…</div>

    <div id="grid"></div>

    <div class="controls">
        <label>Цвет: <input type="color" id="colorPicker" value="#ff0000"></label>
        <button class="danger" id="clearBtn" type="button">Очистить</button>
    </div>

    <div class="target-selector">
        <button class="send-btn" data-target="my" type="button" disabled>Мне</button>
        <button class="send-btn" data-target="parents" type="button" disabled>Родителям</button>
        <button class="send-btn" data-target="all" type="button" disabled>Всем</button>
    </div>

    <script>
        // ---------- Настройки ----------
        // Брокер: WebSocket поверх TLS (страница на https, поэтому нужен wss)
        const BROKER_URL = "wss://broker.hivemq.com:8884/mqtt";

        // Топики матриц. Желательно заменить на длинные уникальные имена
        // (и такие же прописать в WLED), т.к. брокер публичный.
        const TOPICS = {
            my: "artmatrix_il/my/api",
            parents: "artmatrix_il/parents/api",
            all: "artmatrix_il/all/api"
        };

        const BRIGHTNESS = 128;

        // true  — «змейка» исправляется здесь, в коде страницы
        //         (в WLED Serpentine при этом должен быть ВЫКЛЮЧЕН)
        // false — если «змейка» настроена в WLED (2D Matrix + Serpentine)
        const FIX_SERPENTINE = true;

        // ---------- Telegram ----------
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ---------- Статус ----------
        const statusEl = document.getElementById('status');
        const sendButtons = document.querySelectorAll('.send-btn');
        let statusTimer = null;

        function setStatus(text, cls) {
            statusEl.textContent = text;
            statusEl.className = cls || '';
        }

        function setConnected(connected) {
            sendButtons.forEach(b => b.disabled = !connected);
            if (connected) setStatus('Подключено к брокеру', 'ok');
        }

        function flashStatus(text, cls) {
            setStatus(text, cls);
            clearTimeout(statusTimer);
            statusTimer = setTimeout(() => {
                if (client.connected) setStatus('Подключено к брокеру', 'ok');
            }, 2500);
        }

        // ---------- Сетка 8x8 ----------
        const grid = document.getElementById('grid');
        const colorPicker = document.getElementById('colorPicker');
        const pixels = new Array(64).fill("000000");
        let isDrawing = false;

        for (let i = 0; i < 64; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.index = i;
            grid.appendChild(cell);
        }

        function paint(cell) {
            const color = colorPicker.value;
            cell.style.backgroundColor = color;
            pixels[Number(cell.dataset.index)] = color.replace('#', '').toUpperCase();
        }

        function cellAt(x, y) {
            const el = document.elementFromPoint(x, y);
            return el && el.classList.contains('cell') ? el : null;
        }

        function clearGrid() {
            pixels.fill("000000");
            document.querySelectorAll('.cell').forEach(c => {
                c.style.backgroundColor = '#000';
            });
        }

        // Мышь
        grid.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('cell')) {
                isDrawing = true;
                paint(e.target);
            }
        });
        grid.addEventListener('mouseover', (e) => {
            if (isDrawing && e.target.classList.contains('cell')) paint(e.target);
        });
        window.addEventListener('mouseup', () => { isDrawing = false; });

        // Касания (рисование проведением пальца)
        grid.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const t = e.touches[0];
            const cell = cellAt(t.clientX, t.clientY);
            if (cell) paint(cell);
            e.preventDefault();
        }, { passive: false });

        grid.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const t = e.touches[0];
            const cell = cellAt(t.clientX, t.clientY);
            if (cell) paint(cell);
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', () => { isDrawing = false; });
        window.addEventListener('touchcancel', () => { isDrawing = false; });

        // Кнопка «Очистить»
        document.getElementById('clearBtn').addEventListener('click', clearGrid);

        // ---------- MQTT ----------
        const client = mqtt.connect(BROKER_URL, {
            clientId: 'artmatrix_ui_' + Math.random().toString(16).slice(2, 10),
            keepalive: 30,
            reconnectPeriod: 2000,
            connectTimeout: 10000,
            clean: true
        });

        client.on('connect', () => setConnected(true));
        client.on('reconnect', () => {
            setConnected(false);
            setStatus('Переподключение…');
        });
        client.on('offline', () => {
            setConnected(false);
            setStatus('Нет соединения с брокером', 'err');
        });
        client.on('error', (err) => {
            setConnected(false);
            setStatus('Ошибка MQTT: ' + (err && err.message ? err.message : err), 'err');
        });

        // ---------- Отправка на матрицу ----------
        function sendData(target) {
            if (!client.connected) {
                flashStatus('Нет соединения с брокером', 'err');
                return;
            }

            // Раскладываем пиксели по реальным адресам светодиодов
            // (в строках 1, 3, 5, 7 порядок светодиодов обратный)
            const leds = new Array(64).fill("000000");
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const flip = FIX_SERPENTINE && row % 2 === 0;
                    const dst = row * 8 + (flip ? 7 - col : col);
                    leds[dst] = pixels[row * 8 + col];
                }
            }

            // Компактный формат WLED: сначала заливка всего чёрным,
            // затем только цветные участки: [старт, стоп (не включая), "HEX"]
            // или [индекс, "HEX"] для одиночного светодиода
            const wledI = [0, 64, "000000"];
            let start = 0;
            while (start < 64) {
                let end = start + 1;
                while (end < 64 && leds[end] === leds[start]) end++;
                if (leds[start] !== "000000") {
                    if (end - start === 1) wledI.push(start, leds[start]);
                    else wledI.push(start, end, leds[start]);
                }
                start = end;
            }

            const payload = JSON.stringify({
                on: true,
                bri: BRIGHTNESS,
                seg: [{ i: wledI }]
            });

            const topic = TOPICS[target] || TOPICS.my;

            client.publish(topic, payload, { qos: 1 }, (err) => {
                if (err) {
                    flashStatus('Не удалось отправить: ' + err.message, 'err');
                } else {
                    flashStatus('✅ Отправлено: ' + target, 'ok');
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                }
            });
        }

        sendButtons.forEach(btn => {
            btn.addEventListener('click', () => sendData(btn.dataset.target));
        });
    </script>
</body>
</html>
